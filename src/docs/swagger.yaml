definitions:
  controllers.ActivityReply:
    properties:
      accessed_as:
        enum:
        - ACCESSED_AS_UNSPECIFIED
        - ACCESSED_AS_USER
        - ACCESSED_AS_SYSTEM
        type: string
      action:
        type: string
      actor_id:
        type: string
      at:
        type: string
      directory_id:
        type: string
      id:
        type: string
      metadata_json:
        type: string
      note_id:
        type: string
      role_id:
        type: string
    type: object
  controllers.AttachmentLinkBody:
    properties:
      attachment_key:
        type: string
      note_id:
        type: string
    required:
    - attachment_key
    - note_id
    type: object
  controllers.AttachmentMetadataReply:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      filename:
        type: string
      filepath:
        type: string
      key:
        type: string
      sha256:
        type: string
      size:
        type: integer
      updated_at:
        type: string
    type: object
  controllers.BookstackBookImportReply:
    properties:
      attachments_uploaded:
        type: integer
      book_directory_id:
        type: string
      chapters:
        items:
          $ref: '#/definitions/controllers.BookstackImportedChapterReply'
        type: array
      pages_imported:
        type: integer
    type: object
  controllers.BookstackImportedChapterReply:
    properties:
      chapter_name:
        type: string
      directory_id:
        type: string
      pages_imported:
        type: integer
    type: object
  controllers.CreateDirectoryBody:
    properties:
      description:
        example: Shared notes for engineering team
        type: string
      display_name:
        example: Engineering
        type: string
      image_url:
        example: https://cdn.example.com/engineering.png
        type: string
      name:
        example: engineering
        type: string
      parent_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
    required:
    - name
    type: object
  controllers.CreatePermissionBody:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - note
        - directory
        example: note
        type: string
      relationship:
        $ref: '#/definitions/controllers.PermissionRelationshipRequest'
    required:
    - object_id
    - object_type
    - relationship
    type: object
  controllers.CreateShareRequestBody:
    properties:
      description:
        example: Shared with the engineering team
        type: string
      note_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4ca
        type: string
      online_since:
        example: "2026-06-21T12:00:00Z"
        type: string
      online_until:
        example: "2026-06-22T12:00:00Z"
        type: string
      permission:
        enum:
        - SHARE_PERMISSION_UNSPECIFIED
        - SHARE_PERMISSION_READ
        - SHARE_PERMISSION_WRITE
        example: SHARE_PERMISSION_READ
        type: string
    required:
    - note_id
    - permission
    type: object
  controllers.DeletePermissionBody:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - note
        - directory
        example: note
        type: string
      relationship:
        $ref: '#/definitions/controllers.PermissionRelationshipRequest'
    required:
    - object_id
    - object_type
    - relationship
    type: object
  controllers.DeleteSharesBody:
    properties:
      share_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
    required:
    - share_ids
    type: object
  controllers.DirectoryReply:
    properties:
      child_dir_ids:
        items:
          type: string
        type: array
      child_note_ids:
        items:
          type: string
        type: array
      description:
        type: string
      display_name:
        type: string
      id:
        type: string
      image_url:
        type: string
      parent_dir_ids:
        items:
          type: string
        type: array
      relationships:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipReply'
        type: array
      slug:
        type: string
    type: object
  controllers.GetAccessTokenReply:
    properties:
      token:
        type: string
    type: object
  controllers.GetPublicShareResponse:
    properties:
      access_as:
        type: string
      note_id:
        type: string
      online_since:
        type: string
      online_until:
        type: string
      permission:
        enum:
        - SHARE_PERMISSION_UNSPECIFIED
        - SHARE_PERMISSION_READ
        - SHARE_PERMISSION_WRITE
        example: SHARE_PERMISSION_READ
        type: string
    type: object
  controllers.MinimalDirectory:
    properties:
      display_name:
        type: string
      id:
        type: string
      slug:
        type: string
    type: object
  controllers.MinimalNote:
    properties:
      author_id:
        type: string
      directory_ids:
        items:
          type: string
        type: array
      id:
        type: string
      permissions:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipReply'
        type: array
      stripped_content:
        type: string
      tag_ids:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        description: ISO 8601 format
        type: string
    type: object
  controllers.MinimalTag:
    properties:
      display_name:
        type: string
      id:
        type: string
      slug:
        type: string
    type: object
  controllers.NoteReply:
    properties:
      author_id:
        type: string
      content:
        type: string
      directory_ids:
        items:
          type: string
        type: array
      id:
        type: string
      permissions:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipReply'
        type: array
      tag_ids:
        items:
          type: string
        type: array
      title:
        type: string
      tokens:
        additionalProperties:
          type: string
        type: object
      updated_at:
        type: string
    type: object
  controllers.NoteShareReply:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      note_id:
        type: string
      online_since:
        type: string
      online_until:
        type: string
      permission:
        enum:
        - SHARE_PERMISSION_UNSPECIFIED
        - SHARE_PERMISSION_READ
        - SHARE_PERMISSION_WRITE
        example: SHARE_PERMISSION_READ
        type: string
    type: object
  controllers.NoteVersionContentReply:
    properties:
      author_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      note_id:
        type: string
      title:
        type: string
      version_index:
        type: integer
    type: object
  controllers.NoteVersionSummaryReply:
    properties:
      author_id:
        type: string
      created_at:
        type: string
      is_snapshot:
        type: boolean
      note_id:
        type: string
      snapshot_id:
        type: string
      version_id:
        type: string
      version_index:
        type: integer
    type: object
  controllers.NotesReply:
    properties:
      directories:
        items:
          $ref: '#/definitions/controllers.MinimalDirectory'
        type: array
      notes:
        items:
          $ref: '#/definitions/controllers.MinimalNote'
        type: array
      tags:
        items:
          $ref: '#/definitions/controllers.MinimalTag'
        type: array
    type: object
  controllers.PatchAttachmentMetadataRequest:
    properties:
      content_type:
        type: string
      filename:
        type: string
      key:
        type: string
    required:
    - key
    type: object
  controllers.PatchDirectoryBody:
    properties:
      description:
        example: Shared notes for engineering team
        type: string
      display_name:
        example: Engineering
        type: string
      id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      image_url:
        example: https://cdn.example.com/engineering.png
        type: string
      name:
        example: engineering
        type: string
      parent_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
    required:
    - id
    type: object
  controllers.PatchNoteRequest:
    properties:
      content:
        example: This is the updated content of my note.
        type: string
      directory_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
      id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      tag_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
      title:
        example: Updated Note Title
        type: string
    required:
    - id
    type: object
  controllers.PermissionRelationshipReply:
    properties:
      relation:
        type: string
      resource:
        $ref: '#/definitions/controllers.PermissionResourceReply'
      subject:
        $ref: '#/definitions/controllers.PermissionSubjectReply'
    type: object
  controllers.PermissionRelationshipRequest:
    properties:
      relation:
        enum:
        - owner
        - admin
        - writer
        - reader
        - parent
        - parent_directory
        example: reader
        type: string
      resource:
        $ref: '#/definitions/controllers.PermissionResourceRequest'
      subject:
        $ref: '#/definitions/controllers.PermissionSubjectRequest'
    required:
    - relation
    type: object
  controllers.PermissionResourceReply:
    properties:
      object_id:
        type: string
      object_type:
        type: string
    type: object
  controllers.PermissionResourceRequest:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - note
        - directory
        example: note
        type: string
    required:
    - object_id
    - object_type
    type: object
  controllers.PermissionSubjectReply:
    properties:
      object_id:
        type: string
      object_type:
        type: string
    type: object
  controllers.PermissionSubjectRequest:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - user
        - directory
        example: user
        type: string
    required:
    - object_id
    - object_type
    type: object
  controllers.PermissionsReply:
    properties:
      object_id:
        type: string
      object_type:
        enum:
        - PERMISSION_OBJECT_TYPE_UNSPECIFIED
        - PERMISSION_OBJECT_TYPE_NOTE
        - PERMISSION_OBJECT_TYPE_DIRECTORY
        type: string
      relationships:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipReply'
        type: array
    type: object
  controllers.PostNoteRequest:
    properties:
      content:
        example: This is the content of my note.
        type: string
      title:
        example: My Note Title
        type: string
    required:
    - content
    - title
    type: object
  controllers.ReplacePermissionsBody:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - note
        - directory
        example: note
        type: string
      relationships:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipRequest'
        type: array
    required:
    - object_id
    - object_type
    - relationships
    type: object
  controllers.UpdateShareBody:
    properties:
      description:
        example: Updated share description
        type: string
      id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      note_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4ca
        type: string
      online_since:
        example: "2026-06-21T12:00:00Z"
        type: string
      online_until:
        example: "2026-06-22T12:00:00Z"
        type: string
      permission:
        enum:
        - SHARE_PERMISSION_UNSPECIFIED
        - SHARE_PERMISSION_READ
        - SHARE_PERMISSION_WRITE
        example: SHARE_PERMISSION_READ
        type: string
    required:
    - id
    - note_id
    - permission
    type: object
  proto.DeleteAttachmentResponse:
    properties:
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: Provides all methods to persist data for GoToHell
  title: GoToHell Gin REST API
paths:
  /attachment-links:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Unlink payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.AttachmentLinkBody'
      responses:
        "204":
          description: No Content
      summary: Unlink attachment from note
      tags:
      - attachment-links
    post:
      consumes:
      - application/json
      parameters:
      - description: Link payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.AttachmentLinkBody'
      responses:
        "204":
          description: No Content
      summary: Link attachment to note
      tags:
      - attachment-links
  /attachments:
    get:
      parameters:
      - description: Attachment key (or JWT minted for an attachment key)
        in: query
        name: key
        required: true
        type: string
      - description: Resize width
        in: query
        name: width
        type: integer
      - description: Resize height
        in: query
        name: height
        type: integer
      - description: Output format (jpeg,png,webp)
        in: query
        name: format
        type: string
      produces:
      - image/jpeg
      - image/png
      - image/webp
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get attachment
      tags:
      - attachments
    post:
      consumes:
      - multiplart/form-data
      parameters:
      - description: Attachment
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.AttachmentMetadataReply'
      summary: Create attachment
      tags:
      - attachments
  /attachments/{key}:
    delete:
      parameters:
      - description: Attachment key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.DeleteAttachmentResponse'
      summary: Delete attachment
      tags:
      - attachments
    get:
      parameters:
      - description: Attachment key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get attachment
      tags:
      - attachments
  /attachments/{key}/metadata:
    get:
      parameters:
      - description: Attachment key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.AttachmentMetadataReply'
      summary: Get attachment metadata
      tags:
      - attachments
  /attachments/metadata:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Attachment metadata
        in: body
        name: metadata
        required: true
        schema:
          $ref: '#/definitions/controllers.PatchAttachmentMetadataRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.AttachmentMetadataReply'
      summary: Update attachment metadata
      tags:
      - attachments
  /auth/public-access-token:
    post:
      consumes:
      - application/json
      description: Generates a new JWT access token for the user authenticated via
        a session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully generated and returned access token
          schema:
            $ref: '#/definitions/controllers.GetAccessTokenReply'
        "401":
          description: Unauthorized - User is not authenticated via session
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error - Failed to generate JWT or other server-side
            issue
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a new access token
      tags:
      - Authentication
  /auth/token:
    get:
      consumes:
      - application/json
      description: Generates a new JWT access token for the user authenticated via
        a session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully generated and returned access token
          schema:
            $ref: '#/definitions/controllers.GetAccessTokenReply'
        "401":
          description: Unauthorized - User is not authenticated via session
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error - Failed to generate JWT or other server-side
            issue
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a new access token
      tags:
      - Authentication
  /directories:
    get:
      consumes:
      - application/json
      description: Fetch directories via gRPC service
      parameters:
      - description: Parent directory ID
        in: query
        name: parent_id
        type: string
      - description: Maximum results to return
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Include parent directory IDs in each response
        in: query
        name: include_parents
        type: boolean
      - description: Include child directory IDs in each response
        in: query
        name: include_child_dirs
        type: boolean
      - description: Include child note IDs in each response
        in: query
        name: include_child_notes
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controllers.DirectoryReply'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List directories
      tags:
      - directories
    patch:
      consumes:
      - application/json
      description: Updates an existing directory via gRPC service
      parameters:
      - description: Update directory request
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.PatchDirectoryBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.DirectoryReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update directory
      tags:
      - directories
    post:
      consumes:
      - application/json
      description: Creates a directory via gRPC service
      parameters:
      - description: Create directory request
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateDirectoryBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.DirectoryReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create directory
      tags:
      - directories
  /directories/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes an existing directory via gRPC service
      parameters:
      - description: Directory ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.DirectoryReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete directory
      tags:
      - directories
    get:
      consumes:
      - application/json
      description: Fetch directory via gRPC service
      parameters:
      - description: Directory ID
        in: path
        name: id
        required: true
        type: string
      - description: Include parent directories in the response
        in: query
        name: include_parents
        type: boolean
      - description: Include child directory IDs in the response
        in: query
        name: include_child_dirs
        type: boolean
      - description: Include child note IDs in the response
        in: query
        name: include_child_notes
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.DirectoryReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get directory by ID
      tags:
      - directories
  /directories/{id}/activity:
    get:
      consumes:
      - application/json
      description: Fetch latest note activity for a directory (or root when directory_id
        is omitted) via gRPC service
      parameters:
      - description: Directory ID
        in: path
        name: id
        type: string
      - description: Directory ID (fallback)
        in: query
        name: directory_id
        type: string
      - description: Maximum recursion depth
        in: query
        name: max_depth
        type: integer
      - description: Maximum results to return
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controllers.NoteVersionSummaryReply'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get directory activity
      tags:
      - directories
  /directories/{id}/notes:
    get:
      consumes:
      - application/json
      description: Fetch notes belonging to a directory via gRPC service
      parameters:
      - description: Directory ID
        in: path
        name: id
        required: true
        type: string
      - description: Maximum results to return (default 20)
        in: query
        name: limit
        type: integer
      - description: Pagination offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.NotesReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List notes in a directory
      tags:
      - directories
  /directories/activity:
    get:
      consumes:
      - application/json
      description: Fetch latest note activity for a directory (or root when directory_id
        is omitted) via gRPC service
      parameters:
      - description: Directory ID (fallback)
        in: query
        name: directory_id
        type: string
      - description: Maximum recursion depth
        in: query
        name: max_depth
        type: integer
      - description: Maximum results to return
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controllers.NoteVersionSummaryReply'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get directory activity
      tags:
      - directories
  /history:
    get:
      consumes:
      - application/json
      description: |-
        Streams the activity log for everything the requesting user is
        allowed to view. Use `mode=most_used` to stream aggregated note
        scores instead; the `algorithm` query parameter then selects the
        scoring function (count or log_count).

        For entries that reference a note (`note_id` is non-empty), the
        response embeds `note_title` and `note_content` into the JSON
        document carried in `metadata_json`, so a single request can be
        used to render history without further per-note lookups.
      parameters:
      - description: Filter by note ID
        in: query
        name: note_id
        type: string
      - description: Filter by directory ID
        in: query
        name: directory_id
        type: string
      - description: Filter by actor user ID
        in: query
        name: actor_id
        type: string
      - description: Filter by role ID
        in: query
        name: role_id
        type: string
      - description: Filter by access mode
        enum:
        - ACCESSED_AS_USER
        - ACCESSED_AS_SYSTEM
        in: query
        name: accessed_as
        type: string
      - collectionFormat: csv
        description: Filter by one or more actions
        in: query
        items:
          type: string
        name: actions
        type: array
      - description: Limit to events from the last N days
        in: query
        name: days
        type: integer
      - description: Maximum results to return
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Collapse repeats to one per (actor, day) before scoring
        in: query
        name: unique_per_day
        type: boolean
      - description: history (default) or most_used
        enum:
        - history
        - most_used
        in: query
        name: mode
        type: string
      - description: Scoring algorithm for mode=most_used
        enum:
        - MOST_USED_ALGORITHM_COUNT
        - MOST_USED_ALGORITHM_LOG_COUNT
        in: query
        name: algorithm
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controllers.ActivityReply'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stream activity history (or most-used scores)
      tags:
      - history
  /migrations/import_bookstack_book:
