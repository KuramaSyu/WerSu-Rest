      id:
        type: string
      slug:
        type: string
    type: object
  controllers.NoteReply:
    properties:
      attachment_ids:
        items:
          type: string
        type: array
      author_id:
        type: string
      content:
        type: string
      directory_ids:
        items:
          type: string
        type: array
      id:
        type: string
      permissions:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipReply'
        type: array
      shelf_ids:
        items:
          type: string
        type: array
      tag_ids:
        items:
          type: string
        type: array
      title:
        type: string
      tokens:
        additionalProperties:
          type: string
        type: object
      updated_at:
        type: string
    type: object
  controllers.NoteShareReply:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      note_id:
        type: string
      online_since:
        type: string
      online_until:
        type: string
      permission:
        enum:
        - SHARE_PERMISSION_UNSPECIFIED
        - SHARE_PERMISSION_READ
        - SHARE_PERMISSION_WRITE
        example: SHARE_PERMISSION_READ
        type: string
    type: object
  controllers.NoteVersionContentReply:
    properties:
      author_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      note_id:
        type: string
      title:
        type: string
      version_index:
        type: integer
    type: object
  controllers.NoteVersionSummaryReply:
    properties:
      author_id:
        type: string
      created_at:
        type: string
      is_snapshot:
        type: boolean
      note_id:
        type: string
      snapshot_id:
        type: string
      version_id:
        type: string
      version_index:
        type: integer
    type: object
  controllers.NotesReply:
    properties:
      directories:
        items:
          $ref: '#/definitions/controllers.MinimalDirectory'
        type: array
      notes:
        items:
          $ref: '#/definitions/controllers.MinimalNote'
        type: array
      tags:
        items:
          $ref: '#/definitions/controllers.MinimalTag'
        type: array
    type: object
  controllers.PasskeyCeremonyBeginReply:
    properties:
      options:
        additionalProperties: {}
        type: object
      session_key:
        type: string
    type: object
  controllers.PasskeyCeremonyFinishReply:
    properties:
      credential_id:
        type: string
    type: object
  controllers.PasskeyCeremonyFinishRequest:
    properties:
      authenticator_data:
        items:
          type: integer
        type: array
      client_data_json:
        items:
          type: integer
        type: array
      credential_id:
        items:
          type: integer
        type: array
      friendly_name:
        type: string
      session_key:
        type: string
      signature:
        items:
          type: integer
        type: array
    type: object
  controllers.PatchAttachmentMetadataRequest:
    properties:
      content_type:
        type: string
      filename:
        type: string
      key:
        type: string
    required:
    - key
    type: object
  controllers.PatchDirectoryBody:
    properties:
      description:
        example: Shared notes for engineering team
        type: string
      display_name:
        example: Engineering
        type: string
      id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      image_url:
        example: https://cdn.example.com/engineering.png
        type: string
      name:
        example: engineering
        type: string
      parent_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
      shelf_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
    required:
    - id
    type: object
  controllers.PatchNoteRequest:
    properties:
      content:
        example: This is the updated content of my note.
        type: string
      directory_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
      id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      tag_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
      title:
        example: Updated Note Title
        type: string
    required:
    - id
    type: object
  controllers.PermissionRelationshipReply:
    properties:
      relation:
        type: string
      resource:
        $ref: '#/definitions/controllers.PermissionResourceReply'
      subject:
        $ref: '#/definitions/controllers.PermissionSubjectReply'
    type: object
  controllers.PermissionRelationshipRequest:
    properties:
      relation:
        enum:
        - owner
        - admin
        - writer
        - reader
        - parent
        - parent_directory
        example: reader
        type: string
      resource:
        $ref: '#/definitions/controllers.PermissionResourceRequest'
      subject:
        $ref: '#/definitions/controllers.PermissionSubjectRequest'
    required:
    - relation
    type: object
  controllers.PermissionResourceReply:
    properties:
      object_id:
        type: string
      object_type:
        type: string
    type: object
  controllers.PermissionResourceRequest:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - note
        - directory
        example: note
        type: string
    required:
    - object_id
    - object_type
    type: object
  controllers.PermissionSubjectReply:
    properties:
      object_id:
        type: string
      object_type:
        type: string
    type: object
  controllers.PermissionSubjectRequest:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - user
        - directory
        example: user
        type: string
    required:
    - object_id
    - object_type
    type: object
  controllers.PermissionsReply:
    properties:
      object_id:
        type: string
      object_type:
        enum:
        - PERMISSION_OBJECT_TYPE_UNSPECIFIED
        - PERMISSION_OBJECT_TYPE_NOTE
        - PERMISSION_OBJECT_TYPE_DIRECTORY
        type: string
      relationships:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipReply'
        type: array
    type: object
  controllers.PostNoteRequest:
    properties:
      content:
        example: This is the content of my note.
        type: string
      directory_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
      shelf_id:
        description: |-
          Either ShelfId or DirectoryIds must be provided; the gRPC server
          resolves rules against the shelf and auto-selects a directory when
          only ShelfId is set.
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      title:
        example: My Note Title
        type: string
    required:
    - content
    - title
    type: object
  controllers.RemoveUserFromRoleBody:
    properties:
      role_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4ca
        type: string
      subject_user_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
    required:
    - role_id
    - subject_user_id
    type: object
  controllers.ReplacePermissionsBody:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - note
        - directory
        example: note
        type: string
      relationships:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipRequest'
        type: array
    required:
    - object_id
    - object_type
    - relationships
    type: object
  controllers.RoleReply:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  controllers.RuleReply:
    properties:
      action_context:
        additionalProperties: {}
        type: object
      action_type:
        type: string
      attached_entity_id:
        type: string
      attached_entity_type:
        type: string
      condition:
        additionalProperties: {}
        type: object
      created_at:
        type: string
      creator_id:
        type: string
      enabled:
        type: boolean
      event_type:
        type: string
      id:
        type: string
      updated_at:
        type: string
    type: object
  controllers.ServiceStatus:
    properties:
      address:
        type: string
      detail:
        type: string
      dns:
        $ref: '#/definitions/controllers.CheckResult'
      error:
        description: |-
          Error is a convenience field that mirrors the first non-empty error
          from DNS or Service, so monitoring can read the top-level state
          without traversing the nested checks.
        type: string
      reachable:
        type: boolean
      service:
        $ref: '#/definitions/controllers.CheckResult'
    type: object
  controllers.SetBooksBody:
    properties:
      book_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
      shelf_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4ca
        type: string
    required:
    - book_ids
    - shelf_id
    type: object
  controllers.ShelfIdsReply:
    properties:
      shelf_ids:
        items:
          type: string
        type: array
    type: object
  controllers.ShelfReply:
    properties:
      book_ids:
        items:
          type: string
        type: array
      description:
        type: string
      display_name:
        type: string
      id:
        type: string
      image_url:
        type: string
      readme_note_id:
        type: string
      slug:
        type: string
    type: object
  controllers.StatusResponse:
    properties:
      checked_at:
        type: string
      garage:
        $ref: '#/definitions/controllers.ServiceStatus'
      imgproxy:
        $ref: '#/definitions/controllers.ServiceStatus'
      overall_ok:
        type: boolean
      postgres:
        $ref: '#/definitions/controllers.ServiceStatus'
      spicedb:
        $ref: '#/definitions/controllers.ServiceStatus'
      wersu:
        $ref: '#/definitions/controllers.ServiceStatus'
    type: object
  controllers.UpdateRoleBody:
    properties:
      description:
        example: All engineers
        type: string
      name:
        example: engineering
        type: string
    type: object
  controllers.UpdateRuleBody:
    properties:
      action_context:
        additionalProperties: {}
        type: object
      action_type:
        example: add_tag
        type: string
      attached_entity_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      attached_entity_type:
        example: shelf
        type: string
      condition:
        additionalProperties: {}
        type: object
      enabled:
        example: false
        type: boolean
      event_type:
        example: note_created
        type: string
    type: object
  controllers.UpdateShareBody:
    properties:
      description:
        example: Updated share description
        type: string
      id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      note_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4ca
        type: string
      online_since:
        example: "2026-06-21T12:00:00Z"
        type: string
      online_until:
        example: "2026-06-22T12:00:00Z"
        type: string
      permission:
        enum:
        - SHARE_PERMISSION_UNSPECIFIED
        - SHARE_PERMISSION_READ
        - SHARE_PERMISSION_WRITE
        example: SHARE_PERMISSION_READ
        type: string
    required:
    - id
    - note_id
    - permission
    type: object
  controllers.UpdateShelfBody:
    properties:
      description:
        example: Shared notes for engineering team
        type: string
      display_name:
        example: Engineering
        type: string
      id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4ca
        type: string
      image_url:
        example: https://cdn.example.com/engineering.png
        type: string
      readme_note_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      slug:
        example: engineering
        type: string
    required:
    - id
    type: object
  controllers.UserRoleMembershipReply:
    properties:
      granted_at:
        type: string
      role_id:
        type: string
      user_id:
        type: string
    type: object
  models.JsUserAuth:
    properties:
      avatar_url:
        description: |-
          AvatarURL is the absolute URL to the user's avatar. Empty
          string (the protobuf zero-value) renders as JSON null, so
          the frontend sees `avatar_url: null` when no provider has
          resolved an avatar.
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      username:
        type: string
    type: object
  proto.DeleteAttachmentResponse:
    properties:
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: Provides all methods to persist data for GoToHell
  title: GoToHell Gin REST API
paths:
  /attachment-links:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Unlink payload
        in: body
