      description: Accepts a BookStack book zip via multipart/form-data and forwards
        it to the BookstackBookImport gRPC streaming RPC in 1 MiB chunks. Returns
        the created book directory and per-chapter import stats on success.
      parameters:
      - description: BookStack book zip archive
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.BookstackBookImportReply'
        "400":
