  /auth/link/passkey/begin:
    post:
      consumes:
      - application/json
      description: |-
        Starts a WebAuthn registration ceremony for the currently
        authenticated user. The challenge is keyed against the
        user's session so it cannot be replayed against a
        different account.

        The server returns ceremony options
        (`PublicKeyCredentialCreationOptions`) that the browser
        uses to invoke the platform authenticator.

        Returns 503 if passkey support is not configured.
      produces:
      - application/json
      responses:
        "200":
          description: WebAuthn registration options
          schema:
            $ref: '#/definitions/controllers.PasskeyCeremonyBeginReply'
        "401":
          description: Unauthorized - User is not authenticated via session
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable - Passkey support not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Begin linking a passkey to the authenticated account
      tags:
      - Authentication
  /auth/link/passkey/finish:
    post:
      consumes:
      - application/json
      description: |-
        Completes a WebAuthn registration ceremony started by
        `/auth/link/passkey/begin`, attaching the verified passkey
        to the currently authenticated user via
        `AuthService.RegisterPasskey`.

        The browser posts the attestation response
        (`credential_id`, `client_data_json`, `authenticator_data`,
        `signature`) and the `session_key` from the matching /begin.
        The server verifies the challenge, origin, RP ID, and
        attestation signature, then persists the credential via
        `AuthService.RegisterPasskey` with the authenticated user
        as both `user_id` and `requester_id`.
      parameters:
      - description: WebAuthn attestation response
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.PasskeyCeremonyFinishRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Passkey linked to account
          schema:
            $ref: '#/definitions/controllers.PasskeyCeremonyFinishReply'
        "400":
          description: Bad Request - Invalid request body or malformed attestation
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - User is not authenticated, or challenge mismatch
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable - Passkey support not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Finish linking a passkey to the authenticated account
      tags:
      - Authentication
  /auth/passkey/login/begin:
    post:
      consumes:
      - application/json
      description: |-
        Starts a WebAuthn assertion (login) ceremony.

        The server generates a random challenge and returns the
        ceremony options (`PublicKeyCredentialRequestOptions`) for
        the browser. The challenge is stored server-side and must
        be presented to the matching `/finish` endpoint for
        verification. The flow is discoverable (no user identity
        required up front) -- the browser's authenticator selects
        which passkey to use and the User Handle is supplied with
        the assertion.

        Returns 503 if passkey support is not configured.
      produces:
      - application/json
      responses:
        "200":
          description: WebAuthn assertion options
          schema:
            $ref: '#/definitions/controllers.PasskeyCeremonyBeginReply'
        "503":
          description: Service Unavailable - Passkey support not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Begin a passkey login ceremony
      tags:
      - Authentication
  /auth/passkey/login/finish:
    post:
      consumes:
      - application/json
      description: |-
        Completes a WebAuthn assertion (login) ceremony started by
        `/auth/passkey/login/begin`.

        The browser posts the assertion (`credential_id`,
        `client_data_json`, `authenticator_data`, `signature`) and
        the `session_key` from the matching /begin. The server
        resolves the user from the User Handle, verifies the
        signature against the stored public key, bumps the sign
        counter via `AuthService.UpdatePasskeyCounter`, and logs
        the user in.
      parameters:
      - description: WebAuthn assertion response
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.PasskeyCeremonyFinishRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful - session cookie set
          schema:
            $ref: '#/definitions/models.JsUserAuth'
        "400":
          description: Bad Request - Invalid request body or expired ceremony
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - Challenge mismatch, invalid signature, or unknown
            credential
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable - Passkey support not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Finish a passkey login ceremony
      tags:
      - Authentication
  /auth/passkey/register/begin:
    post:
      consumes:
      - application/json
      description: |-
        Starts a WebAuthn registration ceremony for a new passkey.

        The server generates a random challenge and returns the
        ceremony options (`PublicKeyCredentialCreationOptions`) that
        the browser uses to invoke the platform authenticator. The
        challenge is stored server-side and must be presented to
        the matching `/finish` endpoint for verification.

        Returns 503 if passkey support is not configured
        (`WEBAUTHN_RP_ID` unset).
      produces:
      - application/json
      responses:
        "200":
          description: WebAuthn registration options
          schema:
            $ref: '#/definitions/controllers.PasskeyCeremonyBeginReply'
        "400":
          description: Bad Request - Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable - Passkey support not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Begin a passkey registration ceremony
      tags:
      - Authentication
  /auth/passkey/register/finish:
    post:
      consumes:
      - application/json
      description: |-
        Completes a WebAuthn registration ceremony started by
        `/auth/passkey/register/begin`.

        The browser posts the attestation response
        (`credential_id`, `client_data_json`, `authenticator_data`,
        `signature`) and the `session_key` from the matching /begin.
        The server verifies the challenge, origin, RP ID, and
        attestation signature, then persists the credential via
        `AuthService.RegisterPasskey`. The User Handle supplied at
        /begin must already exist (see PostPasskeyRegisterBegin).
      parameters:
      - description: WebAuthn attestation response
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.PasskeyCeremonyFinishRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Passkey registered
          schema:
            $ref: '#/definitions/controllers.PasskeyCeremonyFinishReply'
        "400":
          description: Bad Request - Invalid request body or expired ceremony
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - Challenge mismatch or invalid attestation
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable - Passkey support not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Finish a passkey registration ceremony
      tags:
      - Authentication
  /auth/public-access-token:
