definitions:
  controllers.AttachmentLinkBody:
    properties:
      attachment_key:
        type: string
      note_id:
        type: string
    required:
    - attachment_key
    - note_id
    type: object
  controllers.AttachmentMetadataReply:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      filename:
        type: string
      filepath:
        type: string
      key:
        type: string
      sha256:
        type: string
      size:
        type: integer
      updated_at:
        type: string
    type: object
  controllers.CreateDirectoryBody:
    properties:
      description:
        example: Shared notes for engineering team
        type: string
      display_name:
        example: Engineering
        type: string
      image_url:
        example: https://cdn.example.com/engineering.png
        type: string
      name:
        example: engineering
        type: string
      parent_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
    required:
    - name
    type: object
  controllers.CreatePermissionBody:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - note
        - directory
        example: note
        type: string
      relationship:
        $ref: '#/definitions/controllers.PermissionRelationshipRequest'
    required:
    - object_id
    - object_type
    - relationship
    type: object
  controllers.DeletePermissionBody:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - note
        - directory
        example: note
        type: string
      relationship:
        $ref: '#/definitions/controllers.PermissionRelationshipRequest'
    required:
    - object_id
    - object_type
    - relationship
    type: object
  controllers.DirectoryReply:
    properties:
      description:
        type: string
      display_name:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      parent_id:
        type: string
      relationships:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipReply'
        type: array
    type: object
  controllers.MinimalNote:
    properties:
      author_id:
        type: string
      id:
        type: string
      permissions:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipReply'
        type: array
      stripped_content:
        type: string
      title:
        type: string
      updated_at:
        description: ISO 8601 format
        type: string
    type: object
  controllers.NoteReply:
    properties:
      author_id:
        type: string
      content:
        type: string
      id:
        type: string
      permissions:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipReply'
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  controllers.NoteVersionContentReply:
    properties:
      author_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      note_id:
        type: string
      title:
        type: string
      version_index:
        type: integer
    type: object
  controllers.NoteVersionSummaryReply:
    properties:
      author_id:
        type: string
      created_at:
        type: string
      is_snapshot:
        type: boolean
      note_id:
        type: string
      snapshot_id:
        type: string
      version_id:
        type: string
      version_index:
        type: integer
    type: object
  controllers.PatchDirectoryBody:
    properties:
      description:
        example: Shared notes for engineering team
        type: string
      display_name:
        example: Engineering
        type: string
      id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      image_url:
        example: https://cdn.example.com/engineering.png
        type: string
      name:
        example: engineering
        type: string
      parent_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
    required:
    - id
    type: object
  controllers.PatchNoteRequest:
    properties:
      content:
        example: This is the updated content of my note.
        type: string
      id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      title:
        example: Updated Note Title
        type: string
    required:
    - id
    type: object
  controllers.PermissionRelationshipReply:
    properties:
      relation:
        type: string
      resource:
        $ref: '#/definitions/controllers.PermissionResourceReply'
      subject:
        $ref: '#/definitions/controllers.PermissionSubjectReply'
    type: object
  controllers.PermissionRelationshipRequest:
    properties:
      relation:
        enum:
        - owner
        - admin
        - writer
        - reader
        - parent
        - parent_directory
        example: reader
        type: string
      resource:
        $ref: '#/definitions/controllers.PermissionResourceRequest'
      subject:
        $ref: '#/definitions/controllers.PermissionSubjectRequest'
    required:
    - relation
    type: object
  controllers.PermissionResourceReply:
    properties:
      object_id:
        type: string
      object_type:
        type: string
    type: object
  controllers.PermissionResourceRequest:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - note
        - directory
        example: note
        type: string
    required:
    - object_id
    - object_type
    type: object
  controllers.PermissionSubjectReply:
    properties:
      object_id:
        type: string
      object_type:
        type: string
    type: object
  controllers.PermissionSubjectRequest:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - user
        - directory
        example: user
        type: string
    required:
    - object_id
    - object_type
    type: object
  controllers.PermissionsReply:
    properties:
      object_id:
        type: string
      object_type:
        enum:
        - PERMISSION_OBJECT_TYPE_UNSPECIFIED
        - PERMISSION_OBJECT_TYPE_NOTE
        - PERMISSION_OBJECT_TYPE_DIRECTORY
        type: string
      relationships:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipReply'
        type: array
    type: object
  controllers.PostAttachmentBody:
    properties:
      content:
        items:
          type: integer
        type: array
      content_type:
        type: string
      filename:
        type: string
      filepath:
        type: string
    required:
    - content
    - content_type
    - filename
    - filepath
    type: object
  controllers.PostNoteRequest:
    properties:
      content:
        example: This is the content of my note.
        type: string
      title:
        example: My Note Title
        type: string
    required:
    - content
    - title
    type: object
  controllers.ReplacePermissionsBody:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - note
        - directory
        example: note
        type: string
      relationships:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipRequest'
        type: array
    required:
    - object_id
    - object_type
    - relationships
    type: object
  proto.DeleteAttachmentResponse:
    properties:
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: Provides all methods to persist data for GoToHell
  title: GoToHell Gin REST API
paths:
  /attachment-links:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Unlink payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.AttachmentLinkBody'
      responses:
        "204":
          description: No Content
      summary: Unlink attachment from note
      tags:
      - attachment-links
    post:
      consumes:
      - application/json
      parameters:
      - description: Link payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.AttachmentLinkBody'
      responses:
        "204":
          description: No Content
      summary: Link attachment to note
      tags:
      - attachment-links
  /attachments:
    post:
      consumes:
      - application/json
      parameters:
      - description: Attachment payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.PostAttachmentBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.AttachmentMetadataReply'
      summary: Create attachment
      tags:
      - attachments
  /attachments/{key}:
    delete:
      parameters:
      - description: Attachment key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.DeleteAttachmentResponse'
      summary: Delete attachment
      tags:
      - attachments
    get:
      parameters:
      - description: Attachment key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get attachment
      tags:
      - attachments
  /attachments/{key}/metadata:
    get:
      parameters:
      - description: Attachment key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.AttachmentMetadataReply'
      summary: Get attachment metadata
      tags:
      - attachments
  /directories:
    get:
      consumes:
      - application/json
      description: Fetch directories via gRPC service
      parameters:
      - description: Parent directory ID
        in: query
        name: parent_id
        type: string
      - description: Maximum results to return
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controllers.DirectoryReply'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List directories
      tags:
      - directories
    patch:
      consumes:
      - application/json
      description: Updates an existing directory via gRPC service
      parameters:
      - description: Update directory request
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.PatchDirectoryBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.DirectoryReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update directory
      tags:
      - directories
    post:
      consumes:
      - application/json
      description: Creates a directory via gRPC service
      parameters:
      - description: Create directory request
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateDirectoryBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.DirectoryReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create directory
      tags:
      - directories
  /directories/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes an existing directory via gRPC service
      parameters:
      - description: Directory ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.DirectoryReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete directory
      tags:
      - directories
    get:
      consumes:
      - application/json
      description: Fetch directory via gRPC service
      parameters:
      - description: Directory ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.DirectoryReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get directory by ID
      tags:
      - directories
  /directories/{id}/activity:
    get:
      consumes:
      - application/json
      description: Fetch latest note activity for a directory (or root when directory_id
        is omitted) via gRPC service
      parameters:
      - description: Directory ID
        in: path
        name: id
        type: string
      - description: Directory ID (fallback)
        in: query
        name: directory_id
        type: string
      - description: Maximum recursion depth
        in: query
        name: max_depth
        type: integer
      - description: Maximum results to return
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controllers.NoteVersionSummaryReply'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get directory activity
      tags:
      - directories
  /directories/activity:
    get:
      consumes:
      - application/json
      description: Fetch latest note activity for a directory (or root when directory_id
        is omitted) via gRPC service
      parameters:
      - description: Directory ID (fallback)
        in: query
        name: directory_id
        type: string
      - description: Maximum recursion depth
        in: query
        name: max_depth
        type: integer
      - description: Maximum results to return
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controllers.NoteVersionSummaryReply'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get directory activity
      tags:
      - directories
  /notes:
    patch:
      consumes:
      - application/json
      description: Updates an existing note via gRPC service
      parameters:
      - description: Update Note Request
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.PatchNoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.NoteReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a note
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a new Note via gRPC service
      parameters:
      - description: Note ID
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.PostNoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.NoteReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Post a Note
      tags:
      - users
  /notes/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes an existing note via gRPC service
      parameters:
      - description: Note ID (UUIDv7)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.NoteReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a note
      tags:
      - users
    get:
      consumes:
      - application/json
      description: Fetch note via gRPC service
      parameters:
      - description: Note ID (UUIDv7)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.NoteReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get note by ID
      tags:
      - users
  /notes/{note_id}/versions:
    get:
      consumes:
      - application/json
      description: Fetch note version summaries via gRPC service
      parameters:
      - description: Note ID (UUIDv7)
        in: path
        name: note_id
        required: true
        type: string
      - description: Maximum results to return
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controllers.NoteVersionSummaryReply'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List note versions
      tags:
      - users
  /notes/{note_id}/versions/{version_index}:
    get:
      consumes:
      - application/json
      description: Fetch note version content via gRPC service
      parameters:
      - description: Note ID (UUIDv7)
        in: path
        name: note_id
        required: true
        type: string
      - description: Version index
        in: path
        name: version_index
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.NoteVersionContentReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get note version content
      tags:
      - users
  /notes/{note_id}/versions/{version_index}/restore:
    post:
      consumes:
      - application/json
      description: Restore note version via gRPC service
      parameters:
      - description: Note ID (UUIDv7)
        in: path
        name: note_id
        required: true
        type: string
      - description: Version index
        in: path
        name: version_index
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.NoteReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Restore note version
      tags:
      - users
  /notes/search:
    get:
      consumes:
      - application/json
      description: Search notes via gRPC service
      parameters:
      - description: Search algorithm
        enum:
        - context
        - keyword
        - typo_tolerant
        - latest
        in: query
        name: search_type
        required: true
        type: string
      - description: Search query
        in: query
        name: query
        required: true
        type: string
      - description: Maximum results to return
        in: query
        name: limit
        required: true
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controllers.MinimalNote'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get notes by search criteria
      tags:
      - users
  /permissions:
    delete:
      consumes:
      - application/json
      description: Delete permission via gRPC PermissionService
      parameters:
      - description: Delete permission request
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.DeletePermissionBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.PermissionsReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a permission relationship
      tags:
      - permissions
    get:
      consumes:
      - application/json
      description: Fetch permissions via gRPC PermissionService
      parameters:
      - description: Object type
        enum:
        - note
        - directory
        in: query
        name: object_type
        required: true
        type: string
      - description: Object ID
        in: query
        name: object_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.PermissionsReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get permissions for an object
      tags:
      - permissions
    post:
      consumes:
      - application/json
      description: Create permission via gRPC PermissionService
      parameters:
      - description: Create permission request
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.CreatePermissionBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.PermissionsReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a permission relationship
      tags:
      - permissions
    put:
      consumes:
      - application/json
      description: Replace permissions via gRPC PermissionService
      parameters:
      - description: Replace permissions request
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.ReplacePermissionsBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.PermissionsReply'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
