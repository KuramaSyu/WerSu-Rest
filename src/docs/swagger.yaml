  controllers.DirectoryReply:
    properties:
      child_dir_ids:
        items:
          type: string
        type: array
      child_note_ids:
        items:
          type: string
        type: array
      description:
        type: string
      display_name:
        type: string
      id:
        type: string
      image_url:
        type: string
      parent_dir_ids:
        items:
          type: string
        type: array
      relationships:
        items:
          $ref: '#/definitions/controllers.PermissionRelationshipReply'
        type: array
      shelf_ids:
        items:
          type: string
        type: array
      slug:
        type: string
    type: object
  controllers.GetAccessTokenReply:
    properties:
      token:
        type: string
    type: object
  controllers.GetPublicShareResponse:
    properties:
      access_as:
        type: string
      note_id:
        type: string
      online_since:
        type: string
      online_until:
        type: string
      permission:
        enum:
        - SHARE_PERMISSION_UNSPECIFIED
        - SHARE_PERMISSION_READ
        - SHARE_PERMISSION_WRITE
        example: SHARE_PERMISSION_READ
        type: string
    type: object
  controllers.GetShelvesBody:
    properties:
      ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4ca
        items:
          type: string
        type: array
      include_books:
        example: false
        type: boolean
    required:
    - ids
    type: object
  controllers.MinimalDirectory:
    properties:
      display_name:
        type: string
      id:
        type: string
      slug:
        type: string
    type: object
  controllers.MinimalNote:
    properties:
      author_id:
        type: string
      directory_ids:
