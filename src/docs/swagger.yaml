definitions:
  controllers.ActivityReply:
    properties:
      accessed_as:
        enum:
        - ACCESSED_AS_UNSPECIFIED
        - ACCESSED_AS_USER
        - ACCESSED_AS_SYSTEM
        type: string
      action:
        type: string
      actor_id:
        type: string
      at:
        type: string
      directory_id:
        type: string
      id:
        type: string
      metadata_json:
        type: string
      note_id:
        type: string
      role_id:
        type: string
    type: object
  controllers.AddUserToRoleBody:
    properties:
      role_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4ca
        type: string
      subject_user_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
    required:
    - role_id
    - subject_user_id
    type: object
  controllers.AttachBookBody:
    properties:
      book_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      shelf_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4ca
        type: string
    required:
    - book_id
    - shelf_id
    type: object
  controllers.AttachmentLinkBody:
    properties:
      attachment_key:
        type: string
      note_id:
        type: string
    required:
    - attachment_key
    - note_id
    type: object
  controllers.AttachmentMetadataReply:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      filename:
        type: string
      filepath:
        type: string
      key:
        type: string
      sha256:
        type: string
      size:
        type: integer
      updated_at:
        type: string
    type: object
  controllers.BookIdsReply:
    properties:
      book_ids:
        items:
          type: string
        type: array
    type: object
  controllers.BookstackBookImportReply:
    properties:
      attachments_uploaded:
        type: integer
      book_directory_id:
        type: string
      chapters:
        items:
          $ref: '#/definitions/controllers.BookstackImportedChapterReply'
        type: array
      pages_imported:
        type: integer
    type: object
  controllers.BookstackImportedChapterReply:
    properties:
      chapter_name:
        type: string
      directory_id:
        type: string
      pages_imported:
        type: integer
    type: object
  controllers.BootstrapResultReply:
    properties:
      created_directory_ids:
        items:
          type: string
        type: array
      created_rule_id:
        type: string
      description:
        type: string
    type: object
  controllers.CheckResult:
    properties:
      address:
        description: |-
          Address that was probed (host:port) for the service-level checks, or
          the host portion for DNS-level checks.
        type: string
      detail:
        description: |-
          Detail is an optional human-readable note for the response (e.g.
          the gRPC status name, the number of buckets returned, ...).
        type: string
      error:
        type: string
      latency_ms:
        description: |-
          LatencyMs measures how long the probe took. Zero if the probe was
          skipped (e.g. DNS already failed).
        type: integer
      reachable:
        type: boolean
    type: object
  controllers.CreateDirectoryBody:
    properties:
      description:
        example: Shared notes for engineering team
        type: string
      display_name:
        example: Engineering
        type: string
      image_url:
        example: https://cdn.example.com/engineering.png
        type: string
      name:
        example: engineering
        type: string
      parent_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
      shelf_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
    required:
    - name
    type: object
  controllers.CreatePermissionBody:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - note
        - directory
        example: note
        type: string
      relationship:
        $ref: '#/definitions/controllers.PermissionRelationshipRequest'
    required:
    - object_id
    - object_type
    - relationship
    type: object
  controllers.CreateRoleBody:
    properties:
      description:
        example: All engineers
        type: string
      name:
        example: engineering
        type: string
    required:
    - name
    type: object
  controllers.CreateRuleBody:
    type: object
  controllers.CreateShareRequestBody:
    properties:
      description:
        example: Shared with the engineering team
        type: string
      note_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4ca
        type: string
      online_since:
        example: "2026-06-21T12:00:00Z"
        type: string
      online_until:
        example: "2026-06-22T12:00:00Z"
        type: string
      permission:
        enum:
        - SHARE_PERMISSION_UNSPECIFIED
        - SHARE_PERMISSION_READ
        - SHARE_PERMISSION_WRITE
        example: SHARE_PERMISSION_READ
        type: string
    required:
    - note_id
    - permission
    type: object
  controllers.CreateShelfBody:
    properties:
      bootstrap_strategy:
        example: BOOTSTRAP_STRATEGY_NONE
        type: string
      description:
        example: Shared notes for engineering team
        type: string
      display_name:
        example: Engineering
        type: string
      image_url:
        example: https://cdn.example.com/engineering.png
        type: string
      readme_note_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      slug:
        example: engineering
        type: string
    required:
    - slug
    type: object
  controllers.CreateShelfReply:
    properties:
      bootstrap_result:
        $ref: '#/definitions/controllers.BootstrapResultReply'
      shelf:
        $ref: '#/definitions/controllers.ShelfReply'
    type: object
  controllers.DeletePermissionBody:
    properties:
      object_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      object_type:
        enum:
        - note
        - directory
        example: note
        type: string
      relationship:
        $ref: '#/definitions/controllers.PermissionRelationshipRequest'
    required:
    - object_id
    - object_type
    - relationship
    type: object
  controllers.DeleteSharesBody:
    properties:
      share_ids:
        example:
        - 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        items:
          type: string
        type: array
    required:
    - share_ids
    type: object
  controllers.DeleteShelfBody:
    properties:
      dry:
        example: false
        type: boolean
      id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4ca
        type: string
    required:
    - id
    type: object
  controllers.DeleteShelfReply:
    properties:
      affected_book_ids:
        items:
          type: string
        type: array
      binding_count:
        type: integer
      dry:
        type: boolean
    type: object
  controllers.DetachBookBody:
    properties:
      book_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4cb
        type: string
      shelf_id:
        example: 0195f8f4-1167-7f89-b5ec-b40a8f08f4ca
        type: string
    required:
    - book_id
    - shelf_id
